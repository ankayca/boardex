[project]
name = "boardex-target"
version = "0.1.0"
description = "Boardex MCP server for flashing and debugging MCU targets (ST-Link, J-Link, ...)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD" }
authors = [{ name = "Boardex contributors" }]
dependencies = [
    "boardex-core",
    "mcp>=1.2.0",
    "pyocd>=0.36.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
boardex-target = "boardex_target.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boardex_target"]
