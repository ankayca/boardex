[project]
name = "boardex-target"
version = "0.1.0"
description = "Boardex MCP server for flashing and debugging MCU targets (ST-Link, J-Link, ...)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Boardex contributors" }]
# Lockstep version with the other server packages — bump via servers/VERSION
# + servers/scripts/sync_versions.py, never by hand.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "boardex-core",
    # Servers use FastMCP (`mcp.server.fastmcp`); mcp 2.x renamed that API.
    "mcp>=1.2.0,<2",
    "pyocd>=0.36.0",
    # ELF/DWARF parsing for symbol + source-line resolution (address <-> symbol,
    # locating _SEGGER_RTT). Also a transitive pyOCD dep, but we use it directly.
    "pyelftools>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "boardex-logic"]
logic = ["boardex-logic"]

[project.urls]
Homepage = "https://github.com/ankayca/boardex"
Source = "https://github.com/ankayca/boardex"

[project.scripts]
boardex-target = "boardex_target.server:main"

# Built-in backends register through the same plugin mechanism third-party
# adapter packages use: publish an entry point in this group and the adapter
# appears in list_targets() with zero Boardex code changes.
[project.entry-points."boardex.target_backends"]
pyocd = "boardex_target.adapters.pyocd_adapter:PyOcdAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boardex_target"]
