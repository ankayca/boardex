# Boardex server release — tag-driven (servers-vX.Y.Z).
#
# Publishes the four Python server packages PLUS the `boardex` launcher
# (boardex-app/, UI bundle embedded) as wheels + sdists — to a GitHub Release
# and to PyPI (trusted publishing), which is what makes the complete product a
# one-liner: `pipx install boardex` then `boardex up`. Installers / signed
# desktop packaging stay deferred (BIBLE §2.3 #7).
#
# Gate order: version-lockstep check -> full pytest (servers + boardex-app) ->
# build (UI bundle first, then all five packages) -> the built `boardex`
# metadata is the publishable form (==pins, no file:// paths) -> install the
# built wheels into a clean venv, smoke the runner AND `boardex up` from them
# -> publish the GitHub Release, then PyPI (last: an upload is irreversible).

name: Release (servers)

on:
  push:
    tags:
      - "servers-v*"

permissions:
  contents: write

jobs:
  build:
    name: build wheels + sdists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag matches servers/VERSION and pyprojects are in lockstep
        run: python servers/scripts/sync_versions.py --check --tag "$GITHUB_REF_NAME"

      # The UI bundle the `boardex` wheel embeds. Built once here with an empty
      # VITE_RUNNER_URL (single-origin: the app talks to whoever serves it);
      # the build hook reuses it via BOARDEX_SKIP_UI_BUILD below.
      - name: Build the UI bundle
        run: |
          npm ci
          VITE_RUNNER_URL="" npm run build -w apps/ui

      # Dependency order matters: unpublished local packages must be installed
      # before anything that lists them (boardex-target[dev] needs boardex-logic).
      # The runner's [agent] extra is needed for the provider tests. boardex-app
      # goes in with --no-deps: its sibling requirements are already satisfied
      # by the editable installs, and letting pip resolve them (path or pin)
      # would REINSTALL the four non-editable into site-packages — outside the
      # checkout, where the runner cannot find the contract schemas by walking
      # up, and the runner suite fails wholesale. hatchling is boardex-app's
      # [dev] extra, added by hand because --no-deps skips extras too.
      - name: Run the full test suite first (servers + boardex-app)
        run: |
          python -m pip install --upgrade pip
          pip install -e "servers/boardex-core[dev]"
          pip install -e "servers/boardex-logic[dev]"
          pip install -e "servers/boardex-target[dev]"
          pip install -e "servers/boardex-runner[dev,agent]"
          BOARDEX_SKIP_UI_BUILD=1 pip install --no-deps -e boardex-app
          pip install "hatchling>=1.24"
          pytest servers/boardex-core/tests servers/boardex-target/tests \
                 servers/boardex-logic/tests servers/boardex-runner/tests
          # Separate invocation: boardex-app's test module basenames
          # (test_doctor.py, conftest.py) collide with the server suites'
          # under one rootdir.
          pytest boardex-app/tests

      # boardex-app is built WITHOUT the local-siblings flag: the published
      # artifacts must carry `==<version>` pins, never file:// paths
      # (docs/decisions.md, 2026-07-30 publishable-metadata).
      - name: Build all five packages
        run: |
          pip install build
          for pkg in boardex-core boardex-target boardex-logic boardex-runner; do
            python -m build --outdir dist "servers/$pkg"
          done
          BOARDEX_SKIP_UI_BUILD=1 python -m build --outdir dist boardex-app
          ls -l dist/

      # The pipeline twin of boardex-app/tests/test_packaging.py, read off the
      # bytes that actually get published rather than off metadata rendered
      # in-process. Naming the artifacts by servers/VERSION makes a drifted
      # `boardex` version fail here; a `file://` requirement means
      # BOARDEX_LOCAL_SIBLINGS reached this build, and the pair would install
      # only on the runner that made them, announcing nothing
      # (docs/decisions.md, 2026-07-30 publishable-metadata).
      - name: The `boardex` artifacts are lockstep-versioned and publishable
        run: |
          version="$(cat servers/VERSION)"
          sdist="dist/boardex-$version.tar.gz"
          wheel="dist/boardex-$version-py3-none-any.whl"
          for artifact in "$sdist" "$wheel"; do
            if [ ! -f "$artifact" ]; then
              echo "::error::missing $artifact — the boardex version drifted from servers/VERSION ($version)"
              ls -1 dist/
              exit 1
            fi
          done
          # Requirements live in the RFC 822 headers. Past the first blank line
          # is the long description — README-quickstart, prose about packaging
          # that writes file:// legitimately — so only the headers are read.
          tar -xzOf "$sdist" "boardex-$version/PKG-INFO" | sed -n '1,/^$/p' > "$RUNNER_TEMP/PKG-INFO"
          unzip -p "$wheel" "boardex-$version.dist-info/METADATA" | sed -n '1,/^$/p' > "$RUNNER_TEMP/METADATA"
          for doc in "$RUNNER_TEMP/PKG-INFO" "$RUNNER_TEMP/METADATA"; do
            if grep -n 'file://' "$doc"; then
              echo "::error::$(basename "$doc") carries a file:// requirement — the release build must not set BOARDEX_LOCAL_SIBLINGS"
              exit 1
            fi
            for pin in "boardex-core==$version" "boardex-logic==$version" \
                       "boardex-target==$version" "boardex-runner[agent]==$version"; do
              if ! grep -qxF "Requires-Dist: $pin" "$doc"; then
                echo "::error::$(basename "$doc") does not pin $pin"
                grep '^Requires-Dist:' "$doc"
                exit 1
              fi
            done
          done
          echo "boardex $version: sdist + wheel pin the four siblings, no file:// requirement"

      - uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: dist/
          if-no-files-found: error

  install-smoke:
    name: install wheels + fake-bench smoke
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Checkout only for the smoke script and the contract JSON Schema
      # (read-only cross-language bridge, BIBLE §3) — the runner under test
      # comes exclusively from the built wheels.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: dist/

      - name: Install the built wheels into a clean venv
        run: |
          python -m venv /tmp/release-venv
          /tmp/release-venv/bin/pip install dist/*.whl

      - name: Start boardex-runner (fake bench) from the wheels and smoke it
        run: |
          BOARDEX_CONTRACT_SCHEMA_DIR="$PWD/packages/contract/json-schema" \
            PORT=4390 SPEED=2000 /tmp/release-venv/bin/boardex-runner &
          RUNNER_PID=$!
          python servers/scripts/release_smoke.py --base http://127.0.0.1:4390
          kill "$RUNNER_PID"

      # The complete-product path: `boardex up` from the wheel must serve the
      # embedded UI and the API from one origin, with no checkout to lean on.
      - name: Smoke `boardex up` from the wheel (embedded UI, fake bench)
        run: |
          /tmp/release-venv/bin/boardex up --bench fake --no-open --port 4391 &
          BOARDEX_PID=$!
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:4391/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4391/health | grep -q '"ok": true'
          curl -fsS http://127.0.0.1:4391/ | grep -qi '<!doctype html'
          kill "$BOARDEX_PID"
          wait "$BOARDEX_PID" || true

  publish:
    name: publish GitHub Release
    needs: install-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: dist/

      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Boardex $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "The complete Boardex release: the \`boardex\` launcher (embedded UI — \`boardex up\`, \`boardex up --demo\`) plus the four server packages (boardex-core, boardex-target, boardex-logic, boardex-runner), as wheels + sdists. Install from PyPI with \`pipx install boardex\`, or download all five wheels and \`pip install boardex*.whl\`. See docs/RELEASING.md."

  # PyPI — what makes `pipx install boardex` work for someone who has never
  # seen this repo: the launcher's four `==<VERSION>` pins resolve from the
  # index instead of from a checkout, so all five go up or none do.
  #
  # REQUIRES a trusted publisher registered on PyPI for EACH of the five
  # projects (boardex, boardex-core, boardex-target, boardex-logic,
  # boardex-runner): owner ankayca, repository boardex, workflow release.yml.
  # No API token lives in this repo — the OIDC exchange below mints a
  # short-lived token scoped to the projects that trust this workflow. If a
  # publisher was registered WITH a GitHub environment name, add the matching
  # `environment:` here or the claim will not match.
  #
  # Runs last on purpose: a PyPI version can never be re-uploaded, so the
  # reversible gate (the GitHub Release) clears first.
  publish-pypi:
    name: publish to PyPI (all five)
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # trusted publishing; this job needs nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
