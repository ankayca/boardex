[project]
name = "boardex-logic"
version = "0.1.0"
description = "Boardex MCP server for capturing and decoding with logic analyzers (Kingst, Saleae/fx2lafw, ... via sigrok)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD" }
authors = [{ name = "Boardex contributors" }]
# Lockstep version with the other server packages — bump via servers/VERSION
# + servers/scripts/sync_versions.py, never by hand.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
]
# The heavy lifting is done by a system-installed `sigrok-cli` (libsigrok), which
# is not a Python package, so there is no vendor SDK dependency here.
dependencies = [
    "boardex-core",
    # Servers use FastMCP (`mcp.server.fastmcp`); mcp 2.x renamed that API.
    "mcp>=1.2.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/ankayca/boardex"
Source = "https://github.com/ankayca/boardex"

[project.scripts]
boardex-logic = "boardex_logic.server:main"

# Built-in backends register through the same plugin mechanism third-party
# adapter packages use: publish an entry point in this group and the adapter
# appears in list_analyzers() with zero Boardex code changes.
[project.entry-points."boardex.logic_backends"]
sigrok = "boardex_logic.adapters.sigrok_adapter:SigrokAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boardex_logic"]
