[project]
name = "boardex-runner"
version = "0.1.0"
description = "Boardex orchestrator: scripted run engine over the MCP tool layer, exposing the BIBLE §5 event stream + command API (runnerKind: real)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD" }
authors = [{ name = "Boardex contributors" }]
# Lockstep version with the other server packages — bump via servers/VERSION
# + servers/scripts/sync_versions.py, never by hand.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
    "boardex-core",
    "boardex-target",
    "boardex-logic",
    # HTTP + WebSocket server in one dependency (§5.3 command API + /ws streams).
    "aiohttp>=3.9",
    # Outbound events are validated against packages/contract/json-schema/ at
    # emit time, exactly as the mock runner does (BIBLE §10.1).
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# BENCH=agent extras: imported lazily (provider/mcp host), so fake/real
# deployments and the test suite need none of these installed.
agent = [
    "litellm>=1.40",
    # litellm lazy-imports its proxy path (fastapi + orjson) whenever `tools`
    # is passed to completion(); without these the first tool-calling turn
    # crashes on ModuleNotFoundError.
    "fastapi>=0.100",
    "orjson>=3.9",
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/ankayca/boardex"
Source = "https://github.com/ankayca/boardex"

[project.scripts]
boardex-runner = "boardex_runner.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boardex_runner"]
