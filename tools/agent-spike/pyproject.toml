[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-spike"
version = "0.1.0"
description = "Boardex runner-hosted-agent v0 spike: agent loop + meta-tools + interception, recording fixture-format JSONL (docs/RUNNER_AGENT_V0_SPEC.md)"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40",
    # litellm 1.92 lazy-imports its proxy path (fastapi + orjson) whenever
    # `tools` is passed to completion(); without these the first tool-calling
    # turn crashes on ModuleNotFoundError.
    "fastapi>=0.100",
    "orjson>=3.9",
    "mcp>=1.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
agent-spike = "agent_spike.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
