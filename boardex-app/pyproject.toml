[project]
name = "boardex"
version = "0.1.0"
description = "Boardex in one command: `boardex up` launches the runner with the UI embedded."
readme = "README-quickstart.md"
requires-python = ">=3.10"
license = { text = "TBD" }
authors = [{ name = "Boardex contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
]
# Resolved by the metadata hook in hatch_build.py: local path requirements when
# the four sibling packages are present (a monorepo checkout — which is also
# what pip holds when installing from a git URL), version pins otherwise.
# See README-quickstart.md § "Where the dependencies come from".
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/ankayca/boardex"
Source = "https://github.com/ankayca/boardex"

[project.scripts]
boardex = "boardex_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The sibling packages resolve as local path requirements in a checkout.
allow-direct-references = true

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build]
# Generated by the build hook (npm build + copies) and git-ignored, so it has to
# be re-included explicitly — `artifacts` exists for exactly this.
artifacts = ["boardex_app/_bundled/**"]

[tool.hatch.build.targets.wheel]
packages = ["boardex_app"]

[tool.hatch.build.targets.sdist]
# The sdist carries the bundle too, so `pip install boardex-0.1.0.tar.gz` needs
# no Node either.
include = ["boardex_app", "hatch_build.py", "README-quickstart.md", "tests"]
